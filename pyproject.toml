[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_theme"
version = "0.5.1"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [

]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.splent]
cli_version = "1.11.0"

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "Theme engine with the dual-shell public layout, design tokens and composable blocks"
archetype = "light"

[tool.splent.contract.provides]
routes     = ["/admin/appearance", "/admin/menus", "/lang/<code>", "/theme/preview"]
blueprints = []
models     = []
commands   = []
hooks      = ["layout.authenticated_sidebar"]
services   = []
signals    = []
translations = ["es"]
docker     = []

[tool.splent.contract.requires]
features = ["settings"]
env_vars = ["SITE_NAME", "SITE_TAGLINE", "SPLENT_APP"]
signals  = []

[tool.splent.contract.extensible]
services  = []
templates = ["blocks/breadcrumb.html", "blocks/hero.html", "public_base.html", "theme/admin/appearance.html", "theme/admin/menus.html", "theme/index.html", "theme/preview.html"]
models    = []
hooks     = ["layout.authenticated_sidebar", "layout.body_start", "layout.footer", "layout.head", "layout.hero", "layout.nav", "layout.nav.end", "layout.scripts"]
routes    = false

# ── Configuration ─────────────────────────────────────────────────────────
[tool.splent.config]
# What the site calls itself in its own header. Empty falls back to the
# package name, which is what the code calls it and not what anybody types
# into a browser.
SITE_NAME = ""
SITE_TAGLINE = ""
